name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout river-core (for file:../river-core)
        run: git clone https://github.com/vectojs/river-core.git ../river-core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build river-core (for file:../river-core)
        run: cd ../river-core && bun install && bun run build
      - run: bun install
      - run: bun run format:check
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout river-core (for file:../river-core)
        run: git clone https://github.com/vectojs/river-core.git ../river-core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build river-core (for file:../river-core)
        run: cd ../river-core && bun install && bun run build
      - run: bun install
      - run: bun run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=river
